services:
  - type: web
    name: where-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true
      - key: SITE_ID
        value: where-main
      - key: FRONTEND_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_MOBILITY_REST_API_KEY
        sync: false
